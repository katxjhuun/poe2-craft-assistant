# PoE2 prices: every three hours fetch the official Currency Exchange digest and the Exiled Exchange 2 feed, then
# publish the documents as the npm package poe2-craft-assistant-prices. The PoE2 Craft Assistant page loads its
# prices.js from jsDelivr (or unpkg). npm trusted publishing (OIDC) authenticates the publish: no token is stored.
name: PoE2 prices

on:
  schedule:
    - cron: '20 */3 * * *'   # UTC; GitHub may start scheduled runs some minutes late
  workflow_dispatch:

permissions:
  contents: read
  id-token: write            # npm trusted publishing

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # the hours downloaded by earlier runs, so a run only fetches the new ones
      - name: Restore price hours
        uses: actions/cache@v6
        with:
          path: .kb_cache/cx
          key: cx-${{ github.run_id }}
          restore-keys: cx-

      - name: Fetch prices
        run: python scripts/fetch_prices.py --budget 600

      - name: Build the npm package
        run: python scripts/build_price_package.py

      - name: Publish to npm
        id: publish
        working-directory: npm/prices
        run: |
          npm install -g npm@latest
          npm publish --access public
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # jsDelivr keeps @latest for up to 12 hours. The registry takes a few minutes to list a new version, and a purge
      # before that caches the old one again, so wait until the registry shows the new version, then purge.
      - name: Refresh the jsDelivr copy
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          latest=""
          for i in $(seq 1 40); do
            latest=$(curl -fsS "https://registry.npmjs.org/poe2-craft-assistant-prices/latest?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" || true)
            [ "$latest" = "$VERSION" ] && break
            sleep 15
          done
          echo "registry latest: $latest, published: $VERSION"
          curl -fsS "https://purge.jsdelivr.net/npm/poe2-craft-assistant-prices@latest/prices.js" || true
