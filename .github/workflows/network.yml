# Craft network sweep: the broad check of app/network.js, in the cloud instead of on the player's computer.
# scripts/selftest/network_sweep.js goes through every gear class (no uniques), targets drawn from every modifier a
# base can have and start items in every kind of state; it compares the network's promised cost with the simulator
# playing its rules, and on a share of the scenarios simulates the planner's old routes to see whether one is cheaper.
#
# Two modes:
#   broad  five jobs; a craft of very many uses is played fewer times, so that many scenarios fit (minutes: 17).
#   deep   every scenario is played 100,000 times (one that would take longer than 40 minutes says how far it got).
#          `jobs` runners, four processes each, for `minutes` (330 is five and a half hours; a job may run six).
#
# Cost: the repository is public since 8 Oct 2026, and GitHub does not charge public repositories for standard
# runners. It starts by hand only, and every process stops itself after `minutes`.
name: Craft network sweep

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'broad (many scenarios, fewer plays) or deep (100,000 plays a scenario)'
        type: choice
        options: [broad, deep]
        default: broad
      minutes:
        description: 'Minutes of checking per process (broad: up to 18; deep: up to 330)'
        default: '17'
      jobs:
        description: 'deep only: runners (four processes each; leave a few of the 20 free for the price job)'
        default: '16'

permissions:
  contents: read

concurrency:
  group: network-sweep
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      minutes: ${{ steps.m.outputs.minutes }}
      timeout: ${{ steps.m.outputs.timeout }}
    steps:
      - id: m
        env:
          MODE: ${{ inputs.mode }}
          MINUTES: ${{ inputs.minutes }}
          JOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mode = os.environ.get('MODE') or 'broad'
          if mode == 'deep':
              jobs = min(19, max(1, int(float(os.environ.get('JOBS') or 16))))
              minutes = min(330.0, max(1.0, float(os.environ.get('MINUTES') or 330)))
              procs, total = 4, jobs * 4
              matrix = [{'name': f'deep {j + 1} of {jobs}', 'procs': procs, 'first': j * procs, 'total': total, 'args': '--deep --runs 100000 --rivals 10'} for j in range(jobs)]
          else:
              minutes = min(18.0, max(1.0, float(os.environ.get('MINUTES') or 17)))
              matrix = [{'name': f'broad {j + 1} of 5', 'procs': 1, 'first': j, 'total': 5, 'args': '--runs 1200'} for j in range(5)]
          print('matrix=' + json.dumps({'include': matrix}))
          print('minutes=%g' % minutes)
          print('timeout=%d' % int(minutes + 20))
          PY

  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # the hours the price job downloaded, so only the newest ones are fetched here
      - name: Restore price hours
        uses: actions/cache/restore@v6
        with:
          path: .kb_cache/cx
          key: cx-sweep
          restore-keys: cx-
      - name: Fetch prices
        run: python scripts/fetch_prices.py --budget 240
      - uses: actions/upload-artifact@v7
        with:
          name: prices
          path: .kb_cache/out
          include-hidden-files: true
          retention-days: 3

  sweep:
    needs: [plan, prices]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: prices
          path: .kb_cache/out
      - name: Sweep
        env:
          MINUTES: ${{ needs.plan.outputs.minutes }}
          PROCS: ${{ matrix.procs }}
          FIRST: ${{ matrix.first }}
          TOTAL: ${{ matrix.total }}
        run: |
          mkdir -p out
          fail=0
          for p in $(seq 0 $((PROCS - 1))); do
            node scripts/selftest/network_sweep.js --shard "$((FIRST + p))/$TOTAL" ${{ matrix.args }} --minutes "$MINUTES" --json "out/sweep-$((FIRST + p)).json" > "out/log-$p.txt" 2>&1 &
          done
          for job in $(jobs -p); do wait "$job" || fail=1; done
          cat out/log-*.txt
          exit $fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sweep-${{ strategy.job-index }}
          path: out/*.json
          retention-days: 30
