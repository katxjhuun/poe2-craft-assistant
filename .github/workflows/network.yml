# Craft network sweep: the broad check of app/network.js, in the cloud instead of on the player's computer.
# scripts/selftest/network_sweep.js goes through every gear class (no uniques), targets drawn from every modifier a
# base can have and start items in every kind of state; it compares the network's promised cost with the simulator
# playing its rules, and on a share of the scenarios simulates the planner's old routes to see whether one is cheaper.
#
# Two modes:
#   broad  five jobs; a craft of very many uses is played fewer times, so that many scenarios fit (minutes: 17).
#   deep   every scenario is played 100,000 times (one that would take longer than 40 minutes says how far it got).
#          `jobs` runners, four processes each, for `minutes` (325 at most: a job may run six hours, and a process
#          ends within about ten minutes of `minutes`). The player asked for the limit to be used to the full (17 Oct
#          2026): 19 runners of the 20 a free account runs at once (the sweep starts after the plan and price jobs;
#          the one left free is for the price workflow's hourly runs), 315 minutes (at 325, two jobs of the sixteenth
#          run passed the job's timeout and their reports were lost).
#
# Cost: the repository is public since 8 Oct 2026, and GitHub does not charge public repositories for standard
# runners. It starts by hand only, and every process stops itself after `minutes`.
name: Craft network sweep

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'broad (many scenarios, fewer plays) or deep (100,000 plays a scenario)'
        type: choice
        options: [broad, deep]
        default: broad
      minutes:
        description: 'Minutes of checking per process (broad: up to 18; deep: up to 325, 315 is safe)'
        default: '17'
      jobs:
        description: 'deep only: runners (four processes each; 19 of the 20, one left for the price workflow)'
        default: '19'
      scenarios:
        description: 'all (single modifiers first) or drawn (skip them: drawn sets and the special requests)'
        type: choice
        options: [all, drawn]
        default: all
      from:
        description: 'Start at this round of every base (0: the same scenarios as the last run; the last run''s rounds: new ones)'
        default: '0'

permissions:
  contents: read

concurrency:
  group: network-sweep
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      minutes: ${{ steps.m.outputs.minutes }}
      timeout: ${{ steps.m.outputs.timeout }}
    steps:
      - id: m
        env:
          MODE: ${{ inputs.mode }}
          MINUTES: ${{ inputs.minutes }}
          JOBS: ${{ inputs.jobs }}
          SCENARIOS: ${{ inputs.scenarios }}
          FROM: ${{ inputs.from }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mode = os.environ.get('MODE') or 'broad'
          extra = ' --drawn' if (os.environ.get('SCENARIOS') or 'all') == 'drawn' else ''
          start = max(0, int(float(os.environ.get('FROM') or 0)))
          if start: extra += ' --from %d' % start
          if mode == 'deep':
              jobs = min(19, max(1, int(float(os.environ.get('JOBS') or 16))))
              minutes = min(325.0, max(1.0, float(os.environ.get('MINUTES') or 325)))
              procs, total = 4, jobs * 4
              matrix = [{'name': f'deep {j + 1} of {jobs}', 'procs': procs, 'first': j * procs, 'total': total, 'args': '--deep --runs 100000 --rivals 10' + extra} for j in range(jobs)]
          else:
              minutes = min(18.0, max(1.0, float(os.environ.get('MINUTES') or 17)))
              matrix = [{'name': f'broad {j + 1} of 5', 'procs': 1, 'first': j, 'total': 5, 'args': '--runs 1200' + extra} for j in range(5)]
          print('matrix=' + json.dumps({'include': matrix}))
          print('minutes=%g' % minutes)
          # a process ends within about ten minutes of `minutes` (a scenario in play is cut to what is left of the run)
          print('timeout=%d' % min(355, int(minutes + 25)))
          PY

  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # the hours the price job downloaded, so only the newest ones are fetched here
      - name: Restore price hours
        uses: actions/cache/restore@v6
        with:
          path: .kb_cache/cx
          key: cx-sweep
          restore-keys: cx-
      - name: Fetch prices
        run: python scripts/fetch_prices.py --budget 240
      # The prices as text in the log: a scenario of this run can be replayed with them later, on any computer, without
      # downloading the run's files (scripts/selftest/prices_from_log.js reads them back; POE2_PRICES uses them).
      - name: Prices as text
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('.kb_cache/out/league-forbidden-rites.json'))
          rows = [[r[0], r[2]] for r in d['items'].values() if r[2] is not None]
          for i in range(0, len(rows), 60):
              print('PRICES ' + json.dumps(rows[i:i + 60], separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: prices
          path: .kb_cache/out
          include-hidden-files: true
          retention-days: 3

  sweep:
    needs: [plan, prices]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: prices
          path: .kb_cache/out
      - name: Sweep
        env:
          MINUTES: ${{ needs.plan.outputs.minutes }}
          PROCS: ${{ matrix.procs }}
          FIRST: ${{ matrix.first }}
          TOTAL: ${{ matrix.total }}
        run: |
          mkdir -p out
          fail=0
          for p in $(seq 0 $((PROCS - 1))); do
            node --max-old-space-size=3500 scripts/selftest/network_sweep.js --shard "$((FIRST + p))/$TOTAL" ${{ matrix.args }} --minutes "$MINUTES" --json "out/sweep-$((FIRST + p)).json" > "out/log-$p.txt" 2>&1 &
          done
          for job in $(jobs -p); do wait "$job" || fail=1; done
          exit $fail
      # the reports of the processes, also when the job was stopped (a process writes its report when it ends)
      - name: Reports
        if: always()
        run: cat out/log-*.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sweep-${{ strategy.job-index }}
          path: out/*.json
          retention-days: 30
